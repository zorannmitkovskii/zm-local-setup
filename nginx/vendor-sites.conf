# Vendor microsites on <slug>.ivyevents.mk (IVY-706).
#
# Every approved supplier gets a subdomain free: the slug is already unique
# and we own the parent domain, so there is nothing for them to claim and no
# DNS record for them to publish. The application reads the slug off the Host
# header, so nginx's whole job here is to serve the same SPA and pass the Host
# through untouched.
#
# ─────────────────────────────────────────────────────────────────────────────
# BEFORE THIS FILE DOES ANYTHING, TWO THINGS MUST EXIST — neither is code:
#
#   1. DNS:  *.ivyevents.mk   A/AAAA  ->  this host
#   2. TLS:  a wildcard certificate for *.ivyevents.mk
#            Let's Encrypt issues these only over DNS-01, not HTTP-01 —
#            a per-subdomain HTTP challenge cannot cover a wildcard.
#
# Until both are in place a browser gets NXDOMAIN, or a certificate warning
# that looks exactly like an attack. There is no partial version of this.
# ─────────────────────────────────────────────────────────────────────────────

# The platform's own names. Listed first and explicitly so that the wildcard
# below can never answer for them: `api.ivyevents.mk` is the backend, and a
# vendor whose slug happened to be "api" must not be able to take it.
server {
  listen 80;
  server_name ivyevents.mk www.ivyevents.mk api.ivyevents.mk admin.ivyevents.mk;

  location / {
    proxy_pass http://ivy-events-fe:80;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}

# One label deep, and not a dot in it. `a.b.ivyevents.mk` falls through to no
# server block rather than resolving to `b` — one supplier must answer at one
# address, or search engines count one business as several.
server {
  listen 80;
  server_name "~^(?<vendor_slug>[a-z0-9][a-z0-9-]{0,62})\.ivyevents\.mk$";

  # The SPA, unchanged. The slug is not rewritten into the path: the router
  # reads `window.location.hostname` and the backend resolves by Host, so a
  # rewrite here would put the same decision in a second place.
  location / {
    proxy_pass http://ivy-events-fe:80;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # The API on the same origin, so the microsite makes no cross-origin call
  # and needs no CORS entry per vendor — there would be one per subdomain.
  location /v1/api/ {
    proxy_pass http://ivy-events-be:8081/v1/api/;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 90s;
  }

  # Vendor pages are public and cheap to serve wrong for a minute; they are
  # read far more often than they change.
  location /v1/api/public/microsite {
    proxy_pass http://ivy-events-be:8081/v1/api/public/microsite;
    proxy_set_header Host $host;
    proxy_cache_valid 200 60s;
  }
}
